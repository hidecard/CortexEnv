name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format-and-test:
    name: Format and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Linux runs the complete workspace because the planned isolation
      # dependencies and runtime integrations target Linux.
      - name: Test complete workspace on Linux
        if: runner.os == 'Linux'
        run: cargo test --workspace

      # Linux-only isolation dependencies are target-gated. Windows builds the
      # portable CLI executable and tests the shared contract crate.
      - name: Build cortexenv.exe on Windows
        if: runner.os == 'Windows'
        run: cargo build -p sandbox-cli --bin cortexenv --release

      - name: Test portable crates on Windows
        if: runner.os == 'Windows'
        run: cargo test -p CortexEnv -p sandbox-common

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cortexenv-windows-x86_64
          path: target/release/cortexenv.exe
