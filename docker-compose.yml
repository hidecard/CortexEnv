services:
  cortexenv:
    build:
      context: .
      dockerfile: Dockerfile
    image: cortexenv:local
    ports:
      - "8080:8080"
    environment:
      CORTEXENV_BIND: 0.0.0.0:8080
      CORTEXENV_API_KEY: ${CORTEXENV_API_KEY:-}
      CORTEXENV_MAX_EXECUTIONS_PER_KEY: ${CORTEXENV_MAX_EXECUTIONS_PER_KEY:-2}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
