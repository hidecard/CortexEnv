[package]
name = "sandbox-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
sandbox-common = { path = "../sandbox-common" }
sandbox-core = { path = "../sandbox-core" }
tokio = { version = "1", features = ["full"] }
wasmtime = "28"
wasi-common = "24"
deno_core = "0.338"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
bytes = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(all(target_os = "linux", not(target_env = "uclibc")))'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { workspace = true }
