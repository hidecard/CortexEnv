name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Build cortexenv.exe
        run: cargo build -p sandbox-cli --bin cortexenv --release
      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/cortexenv.exe dist/cortexenv-windows-x86_64.exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortexenv-windows-x86_64
          path: dist/cortexenv-windows-x86_64.exe

  debian:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build release binary
        run: cargo build -p sandbox-cli --bin cortexenv --release
      - name: Build Debian package
        run: cargo deb -p sandbox-cli --no-build
      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortexenv-debian-amd64
          path: target/debian/*.deb

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, debian]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cortexenv-windows-x86_64
          path: release-assets
      - name: Download Debian artifact
        uses: actions/download-artifact@v4
        with:
          name: cortexenv-debian-amd64
          path: release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
