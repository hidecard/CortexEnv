[package]
name = "sandbox-core"
version = "0.1.0"
edition = "2021"

[dependencies]
sandbox-common = { path = "../sandbox-common" }
tempfile = "3"
tracing = "0.1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
dashmap = "5"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process", "mount", "user", "resource", "fs", "time", "sched"] }
cgroups-rs = "0.5.1"
seccompiler = "0.1"
capctl = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
