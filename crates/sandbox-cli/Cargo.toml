[package]
name = "sandbox-cli"
version = "0.1.0"
edition = "2021"
description = "CortexEnv command-line WebAssembly sandbox runner"

[[bin]]
name = "cortexenv"
path = "src/main.rs"

[dependencies]
sandbox-common = { path = "../sandbox-common" }
sandbox-core = { path = "../sandbox-core" }
sandbox-runtime = { path = "../sandbox-runtime" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[package.metadata.deb]
name = "cortexenv"
maintainer = "Sandbox Team"
copyright = "2026, Sandbox Team"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "CortexEnv command-line WebAssembly sandbox runner."
assets = [
    ["target/release/cortexenv", "usr/bin/cortexenv", "755"],
    ["../../README.md", "usr/share/doc/cortexenv/README.md", "644"],
]
