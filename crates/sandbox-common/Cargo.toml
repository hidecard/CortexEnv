[package]
name = "sandbox-common"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
figment = { version = "0.10", features = ["json", "toml"] }
dotenvy = "0.15"

[dev-dependencies]
pretty_assertions = "1"